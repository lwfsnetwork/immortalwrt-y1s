name: Build Y1S HomeProxy Bypass Firmware (23.05)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-y1s-homeproxy.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 最大化磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

      - name: 下载 ImmortalWrt 23.05.7 Image Builder
        run: |
          wget -q https://downloads.immortalwrt.org/releases/23.05.7/targets/ramips/mt7620/immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64.tar.xz
          tar -xJf immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64.tar.xz

      - name: 创建旁路由配置文件
        run: |
          cd immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-bypass << 'EOF'
          #!/bin/sh

          # LAN 旁路由配置
          uci set network.lan.ipaddr='192.168.178.254'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.178.1'
          uci set network.lan.dns='192.168.178.1'
          uci set network.lan.ip6assign=''

          # 删除 WAN
          uci -q delete network.wan
          uci -q delete network.wan6
          uci set network.globals.ula_prefix=''

          # 关闭 DHCP
          uci set dhcp.lan.ignore='1'
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.ra_management='0'

          # 关闭日志服务，减少空间占用
          /etc/init.d/log disable 2>/dev/null
          /etc/init.d/log stop 2>/dev/null
          /etc/init.d/klog disable 2>/dev/null
          /etc/init.d/klog stop 2>/dev/null

          # 设置 root 密码（可自行修改）
          echo -e "Mz2156822\nMz2156822" | passwd root

          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-bypass

      - name: 编译精简固件
        run: |
          cd immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64

          make image \
            PROFILE="lenovo_newifi-y1s" \
            PACKAGES="luci luci-app-homeproxy \
            -luci-i18n-base-zh-cn -luci-i18n-homeproxy-zh-cn \
            -kmod-mt76 -kmod-mt76x2 -kmod-mt76-core -kmod-mt76-usb \
            -kmod-mac80211 -kmod-cfg80211 -wpad-basic-mbedtls -wpad-basic \
            -hostapd -hostapd-common -wpa-supplicant \
            -ppp -ppp-mod-pppoe -kmod-pppoe \
            -odhcp6c -odhcpd -odhcpd-ipv6only -ds-lite \
            -luci-app-opkg -luci-proto-ipv6 -luci-app-firewall \
            -kmod-usb-core -kmod-usb2 -kmod-usb-ohci -kmod-usb-storage \
            -block-mount -e2fsprogs \
            -coremark -htop -nano -bash -curl -wget-ssl -ca-bundle \
            -logd -klogd" \
            FILES="files" \
            DISABLED_SERVICES="odhcpd odhcp6c dnsmasq" \
            EXTRA_IMAGE_NAME="homeproxy-bypass"

      - name: 检查固件大小
        run: |
          cd immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620
          ls -lh *sysupgrade.bin
          SIZE=$(stat -c%s *sysupgrade.bin)
          SIZE_KB=$((SIZE / 1024))
          echo "固件大小: ${SIZE_KB} KB ($((SIZE / 1024 / 1024)) MB)"
          
          if [ $SIZE -gt 16200000 ]; then
            echo "❌ 固件超过 15.5MB，风险较高"
            exit 1
          elif [ $SIZE -gt 15500000 ]; then
            echo "⚠️ 固件超过 15.1MB，建议优先测试能否刷入"
          else
            echo "✅ 大小合格"
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: y1s-homeproxy-bypass-23.05.7
          path: immortalwrt-imagebuilder-23.05.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620/*sysupgrade.bin
          retention-days: 30
